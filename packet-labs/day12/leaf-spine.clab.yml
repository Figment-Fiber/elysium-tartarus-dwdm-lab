name: day12

topology:
  groups:
    fabric:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      daemons: [bgpd]

  nodes:
    leaf1:
      group: fabric
    leaf2:
      group: fabric
    spine1:
      group: fabric
    spine2:
      group: fabric
    host-a:
      kind: linux
      image: alpine:3
      cmd: sleep infinity
    host-b:
      kind: linux
      image: alpine:3
      cmd: sleep infinity

  links:
    - endpoints: ["leaf1:eth1", "spine1:eth1"]
    - endpoints: ["leaf1:eth2", "spine2:eth1"]
    - endpoints: ["leaf2:eth1", "spine1:eth2"]
    - endpoints: ["leaf2:eth2", "spine2:eth2"]
    - endpoints: ["leaf1:eth3", "host-a:eth1"]
    - endpoints: ["leaf2:eth3", "host-b:eth1"]
